<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TSM-CAM Route Optimizer</title>
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/static/style.css?v=20261126-4">
</head>
<body>
  <main class="page">
    <section class="panel">
      <h1>TSM-CAM</h1>
      <p class="subtitle">Straight-line distance route optimizer.</p>
      <form id="route-form">
        <label for="depot">Depot</label>
        <div class="location-input-row">
          <input id="depot" list="place-options" value="Phnom Penh" placeholder="Search departure city" required>
          <button class="pick-location-button" type="button" data-pick-target="depot" aria-label="Pick departure on map">📍</button>
        </div>
        <label>Destinations</label>
        <div class="location-input-row">
          <input class="destination" list="place-options" value="Takeo" placeholder="Destination 1" required>
          <button class="pick-location-button" type="button" data-pick-target="destination-0" aria-label="Pick destination 1 on map">📍</button>
        </div>
        <div class="location-input-row">
          <input class="destination" list="place-options" value="Kampong Cham" placeholder="Destination 2" required>
          <button class="pick-location-button" type="button" data-pick-target="destination-1" aria-label="Pick destination 2 on map">📍</button>
        </div>
        <div class="location-input-row">
          <input class="destination" list="place-options" value="Siem Reap" placeholder="Destination 3" required>
          <button class="pick-location-button" type="button" data-pick-target="destination-2" aria-label="Pick destination 3 on map">📍</button>
        </div>
        <label for="solver-mode">Calculation mode</label>
        <select id="solver-mode">
          <option value="quantum" selected>Quantum (QAOA)</option>
          <option value="classical">Classical</option>
        </select>
        <button type="submit">Optimize route</button>
      </form>
      <section id="animation-panel" class="animation-panel" hidden aria-label="Route animation controls">
        <div class="animation-heading"><strong>Route animation</strong><span id="animation-state">Ready</span></div>
        <div class="animation-controls">
          <button id="animation-pause" type="button" disabled>Pause</button>
          <button id="animation-resume" type="button" disabled>Resume</button>
          <button id="animation-reset" type="button" disabled>Replay</button>
        </div>
        <div class="speed-controls" role="group" aria-label="Animation speed">
          <span>Speed</span>
          <button type="button" data-animation-speed="1">1×</button>
          <button type="button" data-animation-speed="2" class="is-selected">2×</button>
          <button type="button" data-animation-speed="4">4×</button>
        </div>
        <div class="animation-details" aria-live="polite">
          <div><span>Current</span><strong id="animation-current">—</strong></div>
          <div><span>Next</span><strong id="animation-next">—</strong></div>
          <div><span>Journey</span><strong id="animation-progress">0%</strong></div>
          <div><span>Remaining</span><strong id="animation-remaining">—</strong></div>
        </div>
      </section>
      <div id="status" class="status"></div>
      <div id="result" class="result"></div>
      <div id="timing-report" class="timing-report"></div>
    </section>
    <section id="map" class="map"><div id="route-legend" class="route-legend"></div></section>
  </main>
  <datalist id="place-options"></datalist>
  <script src="/static/vendor/leaflet/leaflet.js"></script>
  <script type="module" src="/static/scripts/app.js?v=20261126-4"></script>
</body>
</html>
