<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TSM-CAM Route Optimizer</title>
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/static/style.css?v=20261128-16">
</head>
<body>
  <main class="page">
    <section class="panel">
      <h1>TSM-CAM</h1>
      <p class="subtitle">Straight-line distance route optimizer.</p>
      <form id="route-form">
        <label for="depot">Depot</label>
        <div class="location-input-row">
          <input id="depot" list="place-options" value="Phnom Penh" placeholder="Search departure city" required>
          <button class="pick-location-button" type="button" data-pick-target="depot" aria-label="Pick departure on map">📍</button>
        </div>
        <label>Destinations</label>
        <div class="location-input-row">
          <input class="destination" list="place-options" value="Takeo" placeholder="Destination 1" required>
          <button class="pick-location-button" type="button" data-pick-target="destination-0" aria-label="Pick destination 1 on map">📍</button>
        </div>
        <div class="location-input-row">
          <input class="destination" list="place-options" value="Kampong Cham" placeholder="Destination 2">
          <button class="pick-location-button" type="button" data-pick-target="destination-1" aria-label="Pick destination 2 on map">📍</button>
        </div>
        <div class="location-input-row">
          <input class="destination" list="place-options" value="Siem Reap" placeholder="Destination 3">
          <button class="pick-location-button" type="button" data-pick-target="destination-2" aria-label="Pick destination 3 on map">📍</button>
        </div>
        <button id="optimize-route" class="comparison-submit" type="submit">Optimize route</button>
      </form>
      <button id="toggle-location-pins" class="pin-toggle" type="button" aria-pressed="false">
        Other location pins <span aria-hidden="true">Off</span>
      </button>
      <div id="status" class="status" role="status"></div>
    </section>
    <section class="comparison-workspace" aria-label="Compare route solvers">
      <article class="solver-panel" data-solver-panel="left">
        <header class="solver-header">
          <select id="left-solver" class="solver-picker" form="route-form" aria-label="First algorithm">
            <option value="classical" selected>Classical (Held–Karp)</option>
            <option value="quantum">Quantum (QAOA)</option>
          </select>
        </header>
        <div id="left-map" class="map" aria-label="Left route map"></div>
        <section class="solver-result result" aria-label="Left solver result" hidden></section>
      </article>
      <article class="solver-panel" data-solver-panel="right">
        <header class="solver-header">
          <select id="right-solver" class="solver-picker" form="route-form" aria-label="Second algorithm">
            <option value="classical">Classical (Held–Karp)</option>
            <option value="quantum" selected>Quantum (QAOA)</option>
          </select>
        </header>
        <div id="right-map" class="map" aria-label="Right route map"></div>
        <section class="solver-result result" aria-label="Right solver result" hidden></section>
      </article>
    </section>
  </main>
  <datalist id="place-options"></datalist>
  <script src="/static/vendor/leaflet/leaflet.js"></script>
  <script type="module" src="/static/scripts/app.js?v=20261128-17"></script>
</body>
</html>
