<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TSM-CAM Route Optimizer</title>
  <link rel="stylesheet" href="/static/vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="page">
    <section class="panel">
      <h1>TSM-CAM</h1>
      <p class="subtitle">Straight-line distance route optimizer.</p>
      <form id="route-form">
        <label for="depot">Depot</label>
        <input id="depot" list="place-options" value="Phnom Penh" placeholder="Search departure city" required>
        <label>Destinations</label>
        <input class="destination" list="place-options" value="Takeo" placeholder="Destination 1" required>
        <input class="destination" list="place-options" value="Kampong Cham" placeholder="Destination 2" required>
        <input class="destination" list="place-options" value="Siem Reap" placeholder="Destination 3" required>
        <label for="solver-mode">Calculation mode</label>
        <select id="solver-mode">
          <option value="quantum" selected>Quantum (QAOA)</option>
          <option value="classical">Classical</option>
        </select>
        <div class="map-picker-controls">
          <select id="pick-target" aria-label="Location to pick on map">
            <option value="depot">Pick departure on map</option>
            <option value="destination-0">Pick destination 1 on map</option>
            <option value="destination-1">Pick destination 2 on map</option>
            <option value="destination-2">Pick destination 3 on map</option>
          </select>
          <button id="pick-on-map" type="button">Pick location on map</button>
        </div>
        <button type="submit">Optimize route</button>
      </form>
      <p class="hint">Search a Cambodian city, province, or district. Estimated time assumes 60 km/h.</p>
      <div id="status" class="status"></div>
      <div id="result" class="result"></div>
    </section>
    <section id="map" class="map"><div id="route-legend" class="route-legend"></div></section>
  </main>
  <datalist id="place-options"></datalist>
  <script src="/static/vendor/maplibre/pmtiles.js"></script>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
